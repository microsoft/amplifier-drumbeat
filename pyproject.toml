[project]
name = "drumbeat"
version = "0.1.0"
description = "An automation engine for long-running agent sessions: scheduler, markdown automation format, runner, pinned-session lifecycle, inject: turns, pre-run gate, run artifacts, and the durable delivery-intent outbox."
# amplifier-agent (an unpinned dependency below) requires >=3.12, and the
# engine is validated and run on 3.13 -- so the floor is 3.13, matching the
# README Prerequisites. Was >=3.11, which could not resolve the agent dep.
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    # amplifier-agent is the engine every turn shells out to. It is NOT on
    # PyPI, so the git URL is the mechanism; and it is deliberately UNPINNED
    # (floating main) to keep taking rapid upstream improvements -- the owner
    # accepts the breakage risk that carries. Declaring it here is what makes a
    # single `uv tool install git+<drumbeat repo>` co-install it into the same
    # tool venv, where the runner resolves it as a sibling of its own
    # interpreter (see runner._resolve_agent_command).
    "amplifier-agent @ git+https://github.com/microsoft/amplifier-agent",
    # amplifier-agent-py is the maintained SDK the runner drives every turn
    # through (VISION §3: "the invocation goes through the maintained agent SDK
    # rather than hand-rolled argv and stream parsing"). It ships in the SAME
    # repo as the engine, under wrappers/python-py, and like the engine it is
    # NOT on PyPI and deliberately UNPINNED (floating main) -- the two move
    # together and the owner accepts the breakage risk. It is a pure Python
    # package with no runtime deps of its own; it discovers the engine binary
    # the runner resolves and hands it via `_binary_resolver`.
    "amplifier-agent-py @ git+https://github.com/microsoft/amplifier-agent#subdirectory=wrappers/python-py",
]

[project.scripts]
drumbeat = "drumbeat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# amplifier-agent is declared as a direct git reference (it is not on PyPI).
# hatchling rejects direct references in project.dependencies unless this is
# set, so the package cannot build without it.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/drumbeat"]

[tool.pytest.ini_options]
# amplifier-agent pulls in amplifier-core, whose pytest plugin
# ("amplifier_module") auto-registers via a pytest11 entry point and imports
# pytest_asyncio at load time -- which drumbeat's own suite neither ships nor
# needs. Disable that plugin so the suite runs on nothing but pytest itself
# (stdlib unittest tests + builtin fixtures), with no extra test dependency.
addopts = "-p no:amplifier_module"
