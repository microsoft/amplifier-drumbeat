[project]
name = "drumbeat"
version = "0.1.0"
description = "An automation engine for long-running agent sessions: scheduler, markdown automation format, runner, pinned-session lifecycle, inject: turns, pre-run gate, run artifacts, and the durable delivery-intent outbox."
# amplifier-agent (the git dependency below) requires >=3.12, and the engine is
# validated and run on 3.13 -- so the floor is 3.13, matching the README
# Prerequisites.
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    # amplifier-agent IS the agent library every turn imports (VISION §3,
    # contracts/agent-binding.v1.md): the isolated per-turn worker
    # (drumbeat.agent_worker) imports `amplifier_agent` directly -- no CLI, no
    # argv contract, no stream parsing. It is NOT on PyPI and the distribution
    # lives in a SUBDIRECTORY of its repository, so the full git URL is the
    # mechanism and a bare `amplifier-agent` requirement will not resolve.
    # Pinned to the `v1` line, which is the contracted surface this engine is
    # built against. Declaring it here is what makes a single
    # `uv tool install git+<drumbeat repo>` install the library into the same
    # environment, where the worker imports it under `sys.executable`.
    "amplifier-agent @ git+https://github.com/microsoft/amplifier-agent@v1#subdirectory=packages/python",
]

[project.scripts]
drumbeat = "drumbeat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# amplifier-agent is declared as a direct git reference (it is not on PyPI).
# hatchling rejects direct references in project.dependencies unless this is
# set, so the package cannot build without it.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/drumbeat"]

[tool.pytest.ini_options]
# amplifier-agent pulls in amplifier-core, whose pytest plugin
# ("amplifier_module") auto-registers via a pytest11 entry point and imports
# pytest_asyncio at load time -- which drumbeat's own suite neither ships nor
# needs. Disable that plugin so the suite runs on nothing but pytest itself
# (stdlib unittest tests + builtin fixtures), with no extra test dependency.
addopts = "-p no:amplifier_module"
